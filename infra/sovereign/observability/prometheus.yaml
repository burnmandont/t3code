global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [collector:8888]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: containers
    scrape_interval: 45s
    scrape_timeout: 30s
    static_configs:
      - targets: [cadvisor:8080]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
