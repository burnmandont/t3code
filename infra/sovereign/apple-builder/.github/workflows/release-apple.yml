name: Build sovereign Apple clients

on:
  repository_dispatch:
    types:
      - sovereign_apple_release
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA from the Gitea sovereign repository
        required: true
        type: string
      desktop_version:
        description: Immutable desktop SemVer derived by sovereign CI
        required: true
        type: string
      ios_build_number:
        description: Monotonically increasing TestFlight build number derived by sovereign CI
        required: true
        type: string
      artifact_run_id:
        description: Existing successful build run to publish without rebuilding
        required: false
        default: ""
        type: string

concurrency:
  group: sovereign-apple-${{ github.event.client_payload.commit_sha || inputs.commit_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOURCE_REPOSITORY_URL: https://source.moondiner.com/t3_fork/sovereign.git
  SOURCE_SHA: ${{ github.event.client_payload.commit_sha || inputs.commit_sha }}
  DESKTOP_VERSION: ${{ github.event.client_payload.desktop_version || inputs.desktop_version }}
  IOS_BUILD_NUMBER: ${{ github.event.client_payload.ios_build_number || inputs.ios_build_number }}
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || '' }}

jobs:
  validate-config:
    name: Validate release configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      IOS_DEVELOPMENT_CERTIFICATE_P12: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_P12 }}
      IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      GITEA_CLONE_USERNAME: ${{ vars.GITEA_CLONE_USERNAME }}
      GITEA_CLONE_TOKEN: ${{ secrets.GITEA_CLONE_TOKEN }}
    steps:
      - name: Validate immutable release identity and signing configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -z "$ARTIFACT_RUN_ID" || "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          missing=false
          for name in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER \
            IOS_DEVELOPMENT_CERTIFICATE_P12 \
            IOS_DEVELOPMENT_CERTIFICATE_PASSWORD \
            APPLE_TEAM_ID \
            IOS_BUNDLE_ID \
            GITEA_CLONE_USERNAME \
            GITEA_CLONE_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions configuration: $name" >&2
              missing=true
            fi
          done
          test "$missing" = false
          [[ "$IOS_BUNDLE_ID" =~ ^[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+$ ]]

      - name: Verify read-only Gitea source access
        shell: bash
        env:
          GITEA_CLONE_USERNAME: ${{ vars.GITEA_CLONE_USERNAME }}
          GITEA_CLONE_TOKEN: ${{ secrets.GITEA_CLONE_TOKEN }}
        run: |
          set -euo pipefail
          askpass_path="$RUNNER_TEMP/gitea-askpass"
          cat > "$askpass_path" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEA_CLONE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEA_CLONE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_path"
          export GIT_ASKPASS="$askpass_path"
          export GIT_TERMINAL_PROMPT=0
          git ls-remote "$SOURCE_REPOSITORY_URL" HEAD >/dev/null

  build-desktop:
    name: Build macOS ${{ matrix.arch }}
    needs: validate-config
    if: ${{ inputs.artifact_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Fetch exact source from Gitea
        shell: bash
        env:
          GITEA_CLONE_USERNAME: ${{ vars.GITEA_CLONE_USERNAME }}
          GITEA_CLONE_TOKEN: ${{ secrets.GITEA_CLONE_TOKEN }}
        run: |
          set -euo pipefail
          askpass_path="$RUNNER_TEMP/gitea-askpass"
          cat > "$askpass_path" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEA_CLONE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEA_CLONE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_path"
          export GIT_ASKPASS="$askpass_path"
          export GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin "$SOURCE_REPOSITORY_URL"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/desktop...
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Derive server runtime identity
        shell: bash
        run: |
          set -euo pipefail
          server_runtime_id="$(node infra/sovereign/runtime/derive-server-runtime-id.mjs)"
          test -n "$server_runtime_id"
          printf 'T3CODE_SERVER_RUNTIME_ID=%s\n' "$server_runtime_id" >> "$GITHUB_ENV"
          printf 'T3CODE_TARGET_SERVER_RUNTIME_ID=%s\n' "$server_runtime_id" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Prepare Apple signing material
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY_ID_VALUE"
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          printf 'APPLE_API_KEY=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          T3CODE_OAUTH_ISSUER: https://auth.moondiner.com/api/auth
          T3CODE_OAUTH_CLIENT_ID: t3-code
          T3CODE_OAUTH_RESOURCE: https://relay.moondiner.com
          T3CODE_RELAY_URL: https://relay.moondiner.com
          T3CODE_HOSTED_APP_URL: https://code.moondiner.com
          T3CODE_CLERK_PUBLISHABLE_KEY: ""
          T3CODE_CLERK_JWT_TEMPLATE: ""
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
          VITE_HOSTED_APP_URL: https://code.moondiner.com
          VITE_HOSTED_APP_CHANNEL: sovereign
          VITE_REMOTE_FAVICONS: "0"
          T3CODE_WEB_SOURCEMAP: "0"
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          test -n "$T3CODE_DESKTOP_UPDATE_REPOSITORY"
          vp run dist:desktop:artifact \
            --platform mac \
            --target dmg \
            --arch "${{ matrix.arch }}" \
            --build-version "$DESKTOP_VERSION" \
            --signed \
            --verbose

      - name: Verify notarized artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          test "${#dmgs[@]}" -gt 0
          for dmg in "${dmgs[@]}"; do
            mount_dir="$(mktemp -d "$RUNNER_TEMP/t3-desktop-dmg.XXXXXX")"
            cleanup_mount() {
              hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
              rmdir "$mount_dir" >/dev/null 2>&1 || true
            }
            trap cleanup_mount EXIT
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir" >/dev/null
            apps=("$mount_dir"/*.app)
            test "${#apps[@]}" -eq 1
            app="${apps[0]}"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose "$app"
            cleanup_mount
            trap - EXIT
          done

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in release/*.dmg release/*.zip release/*.blockmap release/*.yml; do
            for file in $pattern; do cp "$file" release-publish/; done
          done
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-x64.yml"
            done
          fi

      - name: Upload desktop assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  build-ios:
    name: Build and upload iOS TestFlight
    needs: validate-config
    if: ${{ inputs.artifact_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_NO_TELEMETRY: "1"
      APP_VARIANT: production
      T3CODE_OAUTH_ISSUER: https://auth.moondiner.com/api/auth
      T3CODE_OAUTH_CLIENT_ID: t3-code
      T3CODE_OAUTH_RESOURCE: https://relay.moondiner.com
      T3CODE_RELAY_URL: https://relay.moondiner.com
      T3CODE_HOSTED_APP_URL: https://code.moondiner.com
      VITE_HOSTED_APP_URL: https://code.moondiner.com
      VITE_HOSTED_APP_CHANNEL: sovereign
      VITE_REMOTE_FAVICONS: "0"
      T3CODE_WEB_SOURCEMAP: "0"
      T3CODE_CLERK_PUBLISHABLE_KEY: ""
      T3CODE_CLERK_JWT_TEMPLATE: ""
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
      T3CODE_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      T3CODE_IOS_BUNDLE_ID_PRODUCTION: ${{ vars.IOS_BUNDLE_ID }}
      T3CODE_IOS_BUILD_NUMBER: ${{ github.event.client_payload.ios_build_number || inputs.ios_build_number }}
      T3CODE_EXPO_UPDATES_URL: ""
    steps:
      - name: Validate immutable iOS release identity
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version | grep -Eq 'Swift version (6[.][2-9]|[7-9][.])'
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$IOS_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$T3CODE_IOS_BUNDLE_ID_PRODUCTION" =~ ^[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+$ ]]
          test -n "$T3CODE_APPLE_TEAM_ID"

      - name: Fetch exact source from Gitea
        shell: bash
        env:
          GITEA_CLONE_USERNAME: ${{ vars.GITEA_CLONE_USERNAME }}
          GITEA_CLONE_TOKEN: ${{ secrets.GITEA_CLONE_TOKEN }}
        run: |
          set -euo pipefail
          askpass_path="$RUNNER_TEMP/gitea-askpass"
          cat > "$askpass_path" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEA_CLONE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEA_CLONE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_path"
          export GIT_ASKPASS="$askpass_path"
          export GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin "$SOURCE_REPOSITORY_URL"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        shell: bash
        run: |
          set -euo pipefail
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          printf '%s\n' "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Prepare App Store Connect authentication
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY_ID_VALUE"
          test -n "$APPLE_API_ISSUER_VALUE"

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_VALUE}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          chmod 600 "$api_key_path"

          printf 'SOVEREIGN_IOS_API_KEY=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          printf 'APPLE_API_KEY=%s\n' "$api_key_path" >> "$GITHUB_ENV"
          printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID_VALUE" >> "$GITHUB_ENV"
          printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER_VALUE" >> "$GITHUB_ENV"

      - name: Install persistent iOS signing identity
        shell: bash
        env:
          IOS_DEVELOPMENT_CERTIFICATE_P12: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_P12 }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/sovereign-ios-development.p12"
          keychain_path="$RUNNER_TEMP/sovereign-ios-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf 'SOVEREIGN_IOS_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          trap 'rm -f "$certificate_path"' EXIT
          printf '::add-mask::%s\n' "$keychain_password"
          printf '%s' "$IOS_DEVELOPMENT_CERTIFICATE_P12" | base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DEVELOPMENT_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F 'Apple Development:'

      - name: Generate production iOS project
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          EXPO_NO_GIT_STATUS=1 pnpm exec expo prebuild --clean --platform ios

          shopt -s nullglob
          workspaces=(ios/*.xcworkspace)
          if [[ "${#workspaces[@]}" -ne 1 ]]; then
            printf 'Expected exactly one generated iOS workspace, found %s:\n' "${#workspaces[@]}" >&2
            printf '  %s\n' "${workspaces[@]:-<none>}" >&2
            exit 1
          fi

          workspace="$PWD/${workspaces[0]}"
          scheme="$(basename "${workspaces[0]}" .xcworkspace)"
          test "$scheme" = "Sovereign"
          printf 'SOVEREIGN_IOS_WORKSPACE=%s\n' "$workspace" >> "$GITHUB_ENV"
          printf 'SOVEREIGN_IOS_SCHEME=%s\n' "$scheme" >> "$GITHUB_ENV"

      - name: Archive signed iOS application
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SOVEREIGN_IOS_WORKSPACE"
          archive="$RUNNER_TEMP/Sovereign.xcarchive"
          xcodebuild \
            -workspace "$SOVEREIGN_IOS_WORKSPACE" \
            -scheme "$SOVEREIGN_IOS_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER" \
            archive
          printf 'T3CODE_IOS_ARCHIVE=%s\n' "$archive" >> "$GITHUB_ENV"

      - name: Verify archived iOS application
        shell: bash
        run: |
          set -euo pipefail
          archive_info="$T3CODE_IOS_ARCHIVE/Info.plist"
          archive_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$archive_info")"
          archive_build_number="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$archive_info")"
          app_relative_path="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' "$archive_info")"
          test "$archive_bundle_id" = "$T3CODE_IOS_BUNDLE_ID_PRODUCTION"
          test "$archive_build_number" = "$IOS_BUILD_NUMBER"
          app="$T3CODE_IOS_ARCHIVE/Products/$app_relative_path"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Upload iOS application to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/t3-ios-export"
          xcodebuild -exportArchive \
            -archivePath "$T3CODE_IOS_ARCHIVE" \
            -exportPath "$export_dir" \
            -exportOptionsPlist infra/sovereign/ci/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APPLE_API_KEY" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"

      - name: Remove temporary Apple signing material
        if: always()
        shell: bash
        run: |
          if test -n "${SOVEREIGN_IOS_KEYCHAIN:-}" && \
            [[ "$SOVEREIGN_IOS_KEYCHAIN" == "$RUNNER_TEMP/"* ]]; then
            security delete-keychain "$SOVEREIGN_IOS_KEYCHAIN" || true
          fi
          if test -n "${SOVEREIGN_IOS_API_KEY:-}" && \
            [[ "$SOVEREIGN_IOS_API_KEY" == "$RUNNER_TEMP/"* ]]; then
            rm -f "$SOVEREIGN_IOS_API_KEY"
          fi

  publish-desktop:
    name: Publish desktop update
    needs:
      - validate-config
      - build-desktop
    if: ${{ always() && needs.validate-config.result == 'success' && (needs.build-desktop.result == 'success' || inputs.artifact_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Fetch exact release helpers from Gitea
        shell: bash
        env:
          GITEA_CLONE_USERNAME: ${{ vars.GITEA_CLONE_USERNAME }}
          GITEA_CLONE_TOKEN: ${{ secrets.GITEA_CLONE_TOKEN }}
        run: |
          set -euo pipefail
          askpass_path="$RUNNER_TEMP/gitea-askpass"
          cat > "$askpass_path" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITEA_CLONE_USERNAME" ;;
            *Password*) printf '%s\n' "$GITEA_CLONE_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass_path"
          export GIT_ASKPASS="$askpass_path"
          export GIT_TERMINAL_PROMPT=0
          git init .
          git remote add origin "$SOURCE_REPOSITORY_URL"
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop assets from this run
        if: ${{ inputs.artifact_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release-assets

      - name: Download desktop assets from an existing run
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Merge updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=false
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            test -f "$arm64_manifest"
            node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
            rm "$x64_manifest"
            found=true
          done
          test "$found" = true

      - name: Publish immutable desktop release
        env:
          SOVEREIGN_GITHUB_REPOSITORY: ${{ github.repository }}
          SOVEREIGN_GITHUB_TOKEN: ${{ github.token }}
          SOVEREIGN_DESKTOP_VERSION: ${{ env.DESKTOP_VERSION }}
          SOVEREIGN_DESKTOP_OUTPUT_DIR: release-assets
        run: node infra/sovereign/ci/publish-desktop-release.mjs
