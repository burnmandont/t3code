# The edge remains reachable by key from arbitrary networks so the operator is
# not locked out while travelling. Password-based root access is never needed.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin prohibit-password

# Bound unauthenticated connection cost without affecting established sessions.
LoginGraceTime 30
MaxAuthTries 3
MaxStartups 10:30:30
