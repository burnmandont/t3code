server {
    server_name connect.moondiner.com;
    access_log /var/log/nginx/connect.moondiner.log t3_sanitized;

    if ($host != connect.moondiner.com) { return 421; }

    # Preserve the edge address for this allowlist. Public client addresses
    # vary, and authorization happens in the sovereign FRPS plugin.
    allow 66.228.57.125;
    allow 170.187.154.70;
    allow 45.79.202.71;
    deny all;

    location = /~!frp {
        if ($t3_second_is_websocket = 0) { return 426; }
        if ($t3_second_frp_origin_allowed = 0) { return 403; }

        proxy_pass https://third_https;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_session_reuse on;

        proxy_set_header Host $host;

        # The edge overwrites this header with the real public client IP.
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 64k;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name *.connect.moondiner.com;
    access_log /var/log/nginx/connect-wildcard.moondiner.log t3_sanitized;

    if ($host !~ ^[^.]+[.]connect[.]moondiner[.]com$) { return 421; }

    # Preserve the edge address for this allowlist. Public client addresses
    # vary, and authorization happens in the sovereign FRPS plugin.
    allow 66.228.57.125;
    allow 170.187.154.70;
    allow 45.79.202.71;
    deny all;

    # Defense in depth with the public edge: no environment cookie may leave
    # this HTTPS tier without the Secure attribute.
    proxy_cookie_flags ~ secure;

    # Defense in depth for the small unauthenticated/signed control payloads.
    # The edge applies the same cap before forwarding across this tier.
    location ~ ^/(?:api/auth/(?:browser-session|pairing-token|websocket-ticket)|oauth/token|api/connect/mint-credential|api/t3-connect/(?:health|mint-credential))/?$ {
        proxy_pass https://third_https;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_session_reuse on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 64k;
    }

    location / {
        proxy_pass https://third_https;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_session_reuse on;

        proxy_set_header Host $host;

        # The edge overwrites this header with the real public client IP.
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
