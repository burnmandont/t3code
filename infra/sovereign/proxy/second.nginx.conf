# Sovereign T3 second proxy.
#
# Install as /etc/nginx/conf.d/t3-sovereign.conf on inprimary. The upstream
# named `third_https` remains defined in /etc/nginx/conf.d/00-upstreams.conf.
# Keep unrelated virtual hosts, such as source.moondiner.com, in their own
# files.

map $http_upgrade $t3_second_is_websocket {
    default       0;
    ~*^websocket$ 1;
}

# FRP 0.70.1 uses an http:// Origin for its native wss transport, while the
# private monitor uses https://. Repeat the edge's exact same-host allowlist so
# a future edge regression cannot expose FRPS to arbitrary browser origins.
map $http_origin $t3_second_frp_origin_allowed {
    default                              0;
    "http://connect.moondiner.com"       1;
    "https://connect.moondiner.com"      1;
}

# Repeat the operator-only email/password boundary after real_ip restores the
# public client address from a trusted edge. Passkey, OAuth, session, and
# discovery routes are intentionally absent from this classifier.
map "$host:$uri" $t3_operator_auth_route {
    default 0;
    ~^auth[.]moondiner[.]com:/api/auth/(?:sign-in/email|sign-up/email|change-password|set-password|verify-password|request-password-reset|reset-password(?:/.*)?)/?$ 1;
}

geo $t3_operator_source {
    default            0;
    73.128.177.70/32   1;
    84.20.25.87/32     1;
}

# $remote_addr is intentionally replaced with the public client address for
# control-plane requests. Preserve an independent check of the original TCP
# peer so direct requests can never bypass the public edge.
map $realip_remote_addr $t3_trusted_edge_peer {
    default         0;
    66.228.57.125   1;
    170.187.154.70  1;
    45.79.202.71    1;
}

map "$t3_operator_auth_route:$t3_operator_source" $t3_reject_operator_auth_route {
    default 0;
    "1:0"  1;
}

# Do not persist OAuth authorization codes or other query-string credentials.
log_format t3_sanitized escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time}';

server {
    server_name code.moondiner.com;
    access_log /var/log/nginx/code.moondiner.log t3_sanitized;

    if ($host != code.moondiner.com) { return 421; }

    # Recover the public client address only from our trusted edge proxies.
    set_real_ip_from 66.228.57.125;
    set_real_ip_from 170.187.154.70;
    set_real_ip_from 45.79.202.71;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($t3_trusted_edge_peer = 0) { return 403; }

    location / {
        proxy_pass https://third_https;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_session_reuse on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 2m;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name auth.moondiner.com;
    access_log /var/log/nginx/auth.moondiner.log t3_sanitized;

    if ($host != auth.moondiner.com) { return 421; }

    # Recover the public client address only from our trusted edge proxies.
    set_real_ip_from 66.228.57.125;
    set_real_ip_from 170.187.154.70;
    set_real_ip_from 45.79.202.71;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    if ($t3_trusted_edge_peer = 0) { return 403; }

    if ($t3_reject_operator_auth_route = 1) { return 403; }

    location / {
        proxy_pass https://third_https;

        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_session_reuse on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 2m;
    }

    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

