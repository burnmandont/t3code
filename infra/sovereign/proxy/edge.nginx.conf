# Sovereign T3 public edge proxy.
#
# Install as /etc/nginx/conf.d/t3-sovereign.conf on the public edge. This file
# is loaded inside Nginx's http {} context.

upstream t3_second_nginx {
    server 73.128.177.70:443;
    keepalive 32;
}

map $http_upgrade $t3_connection_upgrade {
    default upgrade;
    ''      '';
}

map $http_upgrade $t3_is_websocket {
    default       0;
    ~*^websocket$ 1;
}

# FRP 0.70.1 deliberately emits an http:// Origin even when its transport is
# wss. The private monitor uses the public https:// origin. Admit only those
# canonical same-host values so arbitrary browser origins cannot consume FRPS
# WebSocket capacity before connector-token authentication runs.
map $http_origin $t3_frp_origin_allowed {
    default                              0;
    "http://connect.moondiner.com"       1;
    "https://connect.moondiner.com"      1;
}

map $host $t3_known_host {
    default                                      0;
    code.moondiner.com                           1;
    auth.moondiner.com                           1;
    relay.moondiner.com                          1;
    observe.moondiner.com                        1;
    connect.moondiner.com                        1;
    ~^[^.]+[.]connect[.]moondiner[.]com$         1;
}

# Email/password authentication remains an operator recovery mechanism while
# passkey and OAuth routes are public. Keep every Better Auth route that can
# consume, create, change, reset, or verify a password behind the operator
# source boundary. $uri excludes the query string and is normalized by Nginx.
map "$host:$uri" $t3_operator_auth_route {
    default 0;
    ~^auth[.]moondiner[.]com:/api/auth/(?:sign-in/email|sign-up/email|change-password|set-password|verify-password|request-password-reset|reset-password(?:/.*)?)/?$ 1;
}

geo $t3_operator_source {
    default            0;
    73.128.177.70/32   1;
    84.20.25.87/32     1;
}

map "$t3_operator_auth_route:$t3_operator_source" $t3_reject_operator_auth_route {
    default 0;
    "1:0"  1;
}

# Do not persist OAuth authorization codes or other query-string credentials.
log_format t3_sanitized escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"request_time":$request_time}';

# Per-client safeguards at the public trust boundary. These are intentionally
# generous enough for browser startup and long-lived agent WebSockets.
limit_req_zone  $binary_remote_addr zone=t3_control_rate:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=t3_connect_rate:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=t3_connect_handshake_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=t3_client_connections:10m;
limit_conn_zone $server_name        zone=t3_host_connections:10m;

# Reject unknown HTTP hosts instead of falling through to an unrelated virtual
# host merely because its configuration file happened to load first.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    access_log /var/log/nginx/t3-sovereign-rejected-hosts.log t3_sanitized;

    return 421;
}

# TLS requires a certificate before Nginx can read the HTTP Host header. The
# sovereign certificate is used only to complete that handshake; known SNI
# names continue to select their own virtual hosts.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    server_tokens off;

    access_log /var/log/nginx/t3-sovereign-rejected-hosts.log t3_sanitized;

    ssl_certificate     /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 421;
}

# Public control-plane HTTP redirect. Credential routes are blocked separately
# on HTTPS, where Better Auth is served.
server {
    listen 80;
    listen [::]:80;

    server_tokens off;

    server_name
        code.moondiner.com
        auth.moondiner.com
        relay.moondiner.com
        observe.moondiner.com;

    if ($t3_known_host = 0) { return 421; }

    limit_req zone=t3_control_rate burst=80 nodelay;
    limit_req_status 429;

    return 308 https://$host$request_uri;
}

# Public T3 Connect HTTP redirect. These hosts must accept remote FRPC clients
# and remote environments.
server {
    listen 80;
    listen [::]:80;

    server_tokens off;

    server_name
        connect.moondiner.com
        *.connect.moondiner.com;

    if ($t3_known_host = 0) { return 421; }

    limit_req zone=t3_connect_rate burst=100 nodelay;
    limit_req_status 429;

    return 308 https://$host$request_uri;
}

# Public sovereign control plane. Email/password authentication remains
# operator-only through $t3_reject_operator_auth_route.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_tokens off;

    server_name
        code.moondiner.com
        auth.moondiner.com
        relay.moondiner.com
        observe.moondiner.com;

    if ($t3_known_host = 0) { return 421; }
    if ($t3_reject_operator_auth_route = 1) { return 403; }

    access_log /var/log/nginx/t3-sovereign-control.log t3_sanitized;
    error_log  /var/log/nginx/t3-sovereign-control.error.log;

    limit_req zone=t3_control_rate burst=80 nodelay;
    limit_conn t3_client_connections 100;
    limit_conn t3_host_connections 5000;
    limit_req_status 429;
    limit_conn_status 429;

    ssl_certificate     /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:T3ControlTLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # OTLP and batched log payloads use the observability host; application
    # routes still enforce their own smaller limits at the next hop.
    client_max_body_size 16m;

    location / {
        proxy_pass https://t3_second_nginx;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        # Overwrite untrusted forwarding headers at the public boundary.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $t3_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
        # Traefik's HTTP/3 listener is not exposed through this TCP Nginx edge.
        proxy_hide_header Alt-Svc;

        proxy_ssl_server_name on;
        proxy_ssl_name        $host;

        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;
    }
}

# Public T3 Connect FRPC control channel. Only the canonical WebSocket
# endpoint reaches FRPS port 7000; all other apex-host requests fail closed.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_tokens off;

    server_name connect.moondiner.com;

    if ($t3_known_host = 0) { return 421; }

    access_log /var/log/nginx/t3-sovereign-connect.log t3_sanitized;
    error_log  /var/log/nginx/t3-sovereign-connect.error.log;

    # Deliberately public. Authentication is handled by the sovereign
    # relay connector-token plugin inside FRPS.
    ssl_certificate     /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:T3ConnectTLS:10m;
    ssl_session_timeout 1d;

    limit_req zone=t3_connect_handshake_rate burst=20 nodelay;
    limit_conn t3_client_connections 100;
    limit_conn t3_host_connections 5000;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 64k;

    location = /~!frp {
        if ($t3_is_websocket = 0) { return 426; }
        if ($t3_frp_origin_allowed = 0) { return 403; }

        proxy_pass https://t3_second_nginx;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        # The edge is the public trust boundary.
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $t3_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
        proxy_hide_header Alt-Svc;

        proxy_ssl_server_name on;
        proxy_ssl_name        $host;

        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;
    }

    location / {
        return 404;
    }
}

# Public HTTP/WebSocket traffic for linked environments.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_tokens off;

    server_name *.connect.moondiner.com;

    if ($t3_known_host = 0) { return 421; }

    access_log /var/log/nginx/t3-sovereign-connect-environments.log t3_sanitized;
    error_log  /var/log/nginx/t3-sovereign-connect-environments.error.log;

    ssl_certificate     /etc/nginx/tls/t3-sovereign/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/t3-sovereign/current/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:T3ConnectEnvironmentTLS:10m;
    ssl_session_timeout 1d;

    limit_req zone=t3_connect_rate burst=100 nodelay;
    limit_conn t3_client_connections 100;
    limit_conn t3_host_connections 5000;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    # The environment server is reached over loopback HTTP behind FRP. Make
    # the public HTTPS boundary enforce Secure even while older remote runtime
    # versions are still rolling forward to the application-level fix.
    proxy_cookie_flags ~ secure;

    client_max_body_size 100m;

    # Bootstrap credentials and relay-signed control proofs are deliberately
    # small JSON documents. Cap them separately so an unauthenticated caller
    # cannot stream an attachment-sized body through FRP before application
    # authentication runs. Large turn dispatches continue through location /.
    location ~ ^/(?:api/auth/(?:browser-session|pairing-token|websocket-ticket)|oauth/token|api/connect/mint-credential|api/t3-connect/(?:health|mint-credential))/?$ {
        client_max_body_size 64k;

        proxy_pass https://t3_second_nginx;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $t3_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
        proxy_hide_header Alt-Svc;

        proxy_ssl_server_name on;
        proxy_ssl_name        $host;

        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;
    }

    location / {
        proxy_pass https://t3_second_nginx;

        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded       "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $t3_connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_redirect          off;
        proxy_hide_header Alt-Svc;

        proxy_ssl_server_name on;
        proxy_ssl_name        $host;

        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify       on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_session_reuse on;
    }
}
