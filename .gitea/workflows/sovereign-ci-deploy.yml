name: Sovereign CI and deploy

on:
  push:
    branches:
      - sovereign/main
    paths:
      - .gitea/workflows/sovereign-ci-deploy.yml
      - apps/desktop/**
      - apps/mobile/**
      - apps/server/**
      - apps/web/**
      - infra/account/**
      - infra/relay/**
      - infra/sovereign/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - vite.config.ts
  workflow_dispatch:

concurrency:
  group: sovereign-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate sovereign services and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GITEA_SHA: ${{ github.sha }}
      SOVEREIGN_DEPLOY_BRANCH: sovereign/main
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_OBSERVABILITY_UUID: ${{ vars.COOLIFY_OBSERVABILITY_UUID }}
      COOLIFY_CONTROL_UUID: ${{ vars.COOLIFY_CONTROL_UUID }}
      COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_DEPLOY_TIMEOUT_MS: "1200000"
      COOLIFY_DEPLOY_MAX_ATTEMPTS: "2"
      COOLIFY_DEPLOY_RETRY_DELAY_MS: "10000"
      SOVEREIGN_PACKAGE_BASE_URL: ${{ vars.SOVEREIGN_PACKAGE_BASE_URL }}
      SOVEREIGN_PACKAGE_USERNAME: ${{ vars.SOVEREIGN_PACKAGE_USERNAME }}
      SOVEREIGN_FRPC_ASSET_URL: ${{ vars.SOVEREIGN_FRPC_ASSET_URL }}
      SOVEREIGN_PACKAGE_TOKEN: ${{ secrets.SOVEREIGN_PACKAGE_TOKEN }}
      SOVEREIGN_GITHUB_REPOSITORY: ${{ vars.SOVEREIGN_GITHUB_REPOSITORY }}
      SOVEREIGN_GITHUB_PAGES_ORIGIN: ${{ vars.SOVEREIGN_GITHUB_PAGES_ORIGIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Derive server runtime identity
        run: |
          server_runtime_id="$(node infra/sovereign/runtime/derive-server-runtime-id.mjs)"
          test -n "$server_runtime_id"
          printf 'T3CODE_SERVER_RUNTIME_ID=%s\n' "$server_runtime_id" >> "$GITHUB_ENV"
          printf 'T3CODE_TARGET_SERVER_RUNTIME_ID=%s\n' "$server_runtime_id" >> "$GITHUB_ENV"
          printf 'Server runtime ID: %s\n' "$server_runtime_id"

      - name: Install sovereign dependency closures
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter @t3tools/monorepo \
            --filter t3... \
            --filter t3code-account... \
            --filter t3code-relay... \
            --filter @t3tools/desktop... \
            --filter @t3tools/mobile... \
            --filter @t3tools/scripts... \
            --filter @t3tools/web...
          # Install only the native/tool binaries explicitly required by the
          # validated applications; the general dependency install remains
          # --ignore-scripts so imported packages cannot execute arbitrary
          # lifecycle hooks in the production-capable runner.
          pnpm rebuild esbuild
          # pnpm rebuild still honors the ignore-scripts installation policy
          # for Electron in this runner. Invoke the pinned package's installer
          # explicitly, then prove its platform executable exists before any
          # desktop test imports `electron`.
          for attempt in 1 2 3; do
            if node apps/desktop/node_modules/electron/install.js; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Electron download failed; retrying (attempt $((attempt + 1))/3)"
            sleep "$((attempt * 5))"
          done
          node -e 'const fs = require("node:fs"); const executable = require("./apps/desktop/node_modules/electron"); if (!fs.existsSync(executable)) throw new Error(`Electron executable missing at ${executable}`); console.log(`Electron executable: ${executable}`)'

      - name: Typecheck sovereign services
        run: |
          pnpm --filter t3 typecheck
          pnpm --filter t3code-account typecheck
          pnpm --filter t3code-relay typecheck
          pnpm --filter @t3tools/desktop typecheck
          pnpm --filter @t3tools/mobile typecheck
          pnpm --filter @t3tools/web typecheck

      - name: Test sovereign services
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            id -u sovereign-ci >/dev/null 2>&1 || useradd --create-home --shell /bin/bash sovereign-ci
            chown -R sovereign-ci:sovereign-ci apps/server
            runuser --preserve-environment -u sovereign-ci -- \
              env HOME=/home/sovereign-ci pnpm --filter t3 test
          else
            pnpm --filter t3 test
          fi
          pnpm --filter t3code-account test
          pnpm --filter t3code-relay test
          pnpm --filter @t3tools/desktop test
          pnpm --filter @t3tools/mobile test
          pnpm --filter @t3tools/web test

      - name: Test deployment gate
        run: |
          node --test infra/sovereign/backup/backup.test.mjs
          node --test infra/sovereign/ci/deploy-and-verify.test.mjs
          node --test infra/sovereign/ci/derive-client-release.test.mjs
          node --test infra/sovereign/ci/dispatch-apple-release.test.mjs
          node --test infra/sovereign/ci/dispatch-darwin-runtime.test.mjs
          node --test infra/sovereign/ci/publish-desktop-release.test.mjs
          node --test infra/sovereign/monitor/monitor.test.mjs
          node --test infra/sovereign/runtime/artifact-format.test.mjs
          node --test infra/sovereign/runtime/derive-server-runtime-id.test.mjs
          node --test infra/sovereign/runtime/publish-runtime-artifact.test.mjs
          node --test infra/sovereign/runtime/render-installer.test.mjs
          node --test infra/sovereign/runtime/publish-github-runtime.test.mjs
          node --test infra/sovereign/runtime/set-runtime-version.test.mjs
          node --test infra/sovereign/runtime/write-control-plane-discovery.test.mjs

      - name: Derive immutable sovereign runtime version
        run: |
          runtime_version="$(node infra/sovereign/runtime/set-runtime-version.mjs)"
          test -n "$runtime_version"
          printf 'SOVEREIGN_RUNTIME_VERSION=%s\n' "$runtime_version" >> "$GITHUB_ENV"
          printf 'Runtime version: %s\n' "$runtime_version"

      - name: Build sovereign web and desktop applications
        env:
          T3CODE_OAUTH_ISSUER: https://auth.moondiner.com/api/auth
          T3CODE_OAUTH_CLIENT_ID: t3-code
          T3CODE_OAUTH_RESOURCE: https://relay.moondiner.com
          T3CODE_RELAY_URL: https://relay.moondiner.com
          T3CODE_HOSTED_APP_URL: https://code.moondiner.com
          T3CODE_CLERK_PUBLISHABLE_KEY: ""
          T3CODE_CLERK_JWT_TEMPLATE: ""
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_URL: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN: ""
          VITE_HOSTED_APP_URL: https://code.moondiner.com
          VITE_HOSTED_APP_CHANNEL: sovereign
          VITE_REMOTE_FAVICONS: "0"
          T3CODE_WEB_SOURCEMAP: "0"
        run: |
          node infra/sovereign/runtime/write-control-plane-discovery.mjs
          pnpm exec vp run build:desktop

      - name: Verify sovereign client artifacts
        run: |
          test -f apps/web/dist/.well-known/t3-sovereign.json
          test -f apps/server/dist/client/.well-known/t3-sovereign.json
          grep -Fq '"origin": "https://code.moondiner.com"' apps/web/dist/.well-known/t3-sovereign.json
          grep -Fq '"oauthIssuer": "https://auth.moondiner.com/api/auth"' apps/web/dist/.well-known/t3-sovereign.json
          grep -Fq '"relayUrl": "https://relay.moondiner.com"' apps/web/dist/.well-known/t3-sovereign.json
          grep -Fq 'https://code.moondiner.com' apps/server/dist/bin.mjs
          grep -Fq 'https://auth.moondiner.com/api/auth' apps/server/dist/bin.mjs
          grep -Fq 'https://relay.moondiner.com' apps/server/dist/bin.mjs
          grep -Fq 'https://auth.moondiner.com/api/auth' apps/desktop/dist-electron/main.cjs
          grep -Fq 'https://relay.moondiner.com' apps/desktop/dist-electron/main.cjs
          grep -R -Fq 'https://auth.moondiner.com/api/auth' apps/server/dist/client
          grep -R -Fq 'https://relay.moondiner.com' apps/server/dist/client
          grep -R -Fq "$SOVEREIGN_RUNTIME_VERSION" apps/web/dist
          grep -R -Fq "$SOVEREIGN_RUNTIME_VERSION" apps/server/dist/client
          grep -R -Fq "$T3CODE_TARGET_SERVER_RUNTIME_ID" apps/web/dist
          grep -Fq "$T3CODE_SERVER_RUNTIME_ID" apps/server/dist/bin.mjs
          if grep -R -Eq 'pk_(live|test)_[A-Za-z0-9_-]{12,}|xaat-[A-Za-z0-9_-]{8,}' \
            apps/desktop/dist-electron apps/server/dist/client; then
            echo 'Sovereign client artifacts contain an external-service credential pattern.' >&2
            exit 1
          fi
          if grep -R -F \
            --include='*.cjs' --include='*.js' --include='*.mjs' \
            -e '@clerk/electron' -e '@clerk/react' -e 'cloudflared/releases/download' \
            apps/desktop/dist-electron apps/server/dist; then
            echo 'Sovereign artifacts contain an inactive external provider implementation.' >&2
            exit 1
          fi

      - name: Build signed complete sovereign runtime
        # Rebuild the anonymously distributed server after the configured
        # browser/desktop artifacts have been verified. Public runtime users
        # must explicitly select their own sovereign control plane.
        env:
          T3CODE_BUILD_NEUTRAL_PUBLIC_RUNTIME: "1"
          T3CODE_OAUTH_ISSUER: ""
          T3CODE_OAUTH_CLIENT_ID: ""
          T3CODE_OAUTH_RESOURCE: ""
          T3CODE_RELAY_URL: ""
          T3CODE_HOSTED_APP_URL: ""
          T3CODE_CLERK_PUBLISHABLE_KEY: ""
          T3CODE_CLERK_JWT_TEMPLATE: ""
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_URL: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN: ""
          VITE_HOSTED_APP_URL: ""
          VITE_HOSTED_APP_CHANNEL: sovereign
          VITE_REMOTE_FAVICONS: "0"
          T3CODE_WEB_SOURCEMAP: "0"
          SOVEREIGN_RUNTIME_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SOVEREIGN_RUNTIME_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          # The configured browser build above generates this document in the
          # shared Vite public directory. It describes the operator's hosted
          # control plane and must not be copied into the anonymous runtime.
          rm -f apps/web/public/.well-known/t3-sovereign.json
          pnpm exec vp run --filter t3 build
          test ! -e apps/web/dist/.well-known/t3-sovereign.json
          test ! -e apps/server/dist/client/.well-known/t3-sovereign.json
          if grep -R -F -e 'https://code.moondiner.com' \
            -e 'https://auth.moondiner.com/api/auth' \
            -e 'https://relay.moondiner.com' apps/server/dist; then
            echo 'Public server runtime contains a private control-plane endpoint.' >&2
            exit 1
          fi
          if grep -R -F \
            --include='*.cjs' --include='*.js' --include='*.mjs' \
            -e '@clerk/electron' -e '@clerk/react' -e 'cloudflared/releases/download' \
            apps/server/dist; then
            echo 'Public sovereign runtime contains an inactive external provider implementation.' >&2
            exit 1
          fi
          test -n "$SOVEREIGN_RUNTIME_SIGNING_PRIVATE_KEY_B64"
          test -n "$SOVEREIGN_FRPC_ASSET_URL"
          node infra/sovereign/runtime/build-runtime-artifact.mjs

      - name: Publish immutable sovereign runtime to Gitea
        run: |
          test -n "$SOVEREIGN_PACKAGE_BASE_URL"
          test -n "$SOVEREIGN_PACKAGE_USERNAME"
          test -n "$SOVEREIGN_PACKAGE_TOKEN"
          node infra/sovereign/runtime/publish-runtime-artifact.mjs

      - name: Build and publish Darwin runtime on GitHub macOS runner
        env:
          SOVEREIGN_GITHUB_BUILDER_TOKEN: ${{ secrets.SOVEREIGN_GITHUB_TOKEN }}
        run: |
          test -n "$SOVEREIGN_GITHUB_REPOSITORY"
          test -n "$SOVEREIGN_GITHUB_BUILDER_TOKEN"
          darwin_dispatch="$(node infra/sovereign/ci/dispatch-darwin-runtime.mjs)"
          printf '%s\n' "$darwin_dispatch"
          darwin_run_id="$(printf '%s\n' "$darwin_dispatch" | sed -n 's/^DARWIN_RUNTIME_RUN_ID=//p')"
          test "$darwin_run_id" -gt 0
          SOVEREIGN_RUNTIME_OUTPUT_DIR=infra/sovereign/dist/runtime-darwin \
            SOVEREIGN_DARWIN_RUNTIME_RUN_ID="$darwin_run_id" \
            node infra/sovereign/ci/download-darwin-runtime.mjs
          SOVEREIGN_RUNTIME_OUTPUT_DIR=infra/sovereign/dist/runtime-darwin \
            node infra/sovereign/runtime/sign-runtime-artifact.mjs
          SOVEREIGN_RUNTIME_OUTPUT_DIR=infra/sovereign/dist/runtime-darwin \
            node infra/sovereign/runtime/publish-runtime-artifact.mjs
          SOVEREIGN_RUNTIME_OUTPUT_DIR=infra/sovereign/dist/runtime-darwin \
            SOVEREIGN_GITHUB_TOKEN="$SOVEREIGN_GITHUB_BUILDER_TOKEN" \
            SOVEREIGN_PUBLISH_STABLE_CHANNEL=0 \
            node infra/sovereign/runtime/publish-github-runtime.mjs

      - name: Publish credentialless sovereign runtime to GitHub
        env:
          SOVEREIGN_RUNTIME_SIGNING_PRIVATE_KEY_B64: ${{ secrets.SOVEREIGN_RUNTIME_SIGNING_PRIVATE_KEY_B64 }}
          SOVEREIGN_GITHUB_TOKEN: ${{ secrets.SOVEREIGN_GITHUB_TOKEN }}
        run: |
          test -n "$SOVEREIGN_GITHUB_REPOSITORY"
          test -n "$SOVEREIGN_GITHUB_PAGES_ORIGIN"
          test -n "$SOVEREIGN_GITHUB_TOKEN"
          node infra/sovereign/runtime/publish-github-runtime.mjs

      - name: Validate deployment configuration
        run: |
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_OBSERVABILITY_UUID"
          test -n "$COOLIFY_CONTROL_UUID"
          test -n "$COOLIFY_WEB_UUID"
          test -n "$COOLIFY_TOKEN"

      - name: Deploy observability, t3-control, and t3-web
        run: node infra/sovereign/ci/deploy-and-verify.mjs

      - name: Derive immutable Apple client release
        if: github.ref == 'refs/heads/sovereign/main' && vars.SOVEREIGN_GITHUB_REPOSITORY != ''
        run: |
          export SOVEREIGN_CLIENT_BASE_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          node infra/sovereign/ci/derive-client-release.mjs --github-env

      - name: Dispatch Apple release to ephemeral GitHub runners
        if: github.ref == 'refs/heads/sovereign/main' && vars.SOVEREIGN_GITHUB_REPOSITORY != ''
        env:
          SOVEREIGN_GITHUB_REPOSITORY: ${{ vars.SOVEREIGN_GITHUB_REPOSITORY }}
          SOVEREIGN_GITHUB_BUILDER_TOKEN: ${{ secrets.SOVEREIGN_GITHUB_TOKEN }}
        run: |
          test -n "$SOVEREIGN_GITHUB_REPOSITORY"
          test -n "$SOVEREIGN_GITHUB_BUILDER_TOKEN"
          node infra/sovereign/ci/dispatch-apple-release.mjs
