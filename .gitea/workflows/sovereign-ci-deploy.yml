name: Sovereign CI and deploy

on:
  push:
    branches:
      - sovereign-direct
    paths:
      - .gitea/workflows/sovereign-ci-deploy.yml
      - apps/desktop/**
      - apps/server/**
      - apps/web/**
      - infra/account/**
      - infra/relay/**
      - infra/sovereign/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/**
      - vite.config.ts
  workflow_dispatch:

concurrency:
  group: sovereign-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate sovereign services and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_CONTROL_UUID: ${{ vars.COOLIFY_CONTROL_UUID }}
      COOLIFY_WEB_UUID: ${{ vars.COOLIFY_WEB_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_DEPLOY_TIMEOUT_MS: "1200000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate

      - name: Install sovereign dependency closures
        run: |
          pnpm install --frozen-lockfile --ignore-scripts \
            --filter @t3tools/monorepo \
            --filter t3... \
            --filter t3code-account... \
            --filter t3code-relay... \
            --filter @t3tools/desktop... \
            --filter @t3tools/scripts... \
            --filter @t3tools/web...
          pnpm rebuild esbuild

      - name: Typecheck sovereign services
        run: |
          pnpm --filter t3code-account typecheck
          pnpm --filter t3code-relay typecheck
          pnpm --filter @t3tools/desktop typecheck
          pnpm --filter @t3tools/web typecheck

      - name: Test sovereign services
        run: |
          pnpm --filter t3code-account test
          pnpm --filter t3code-relay test
          pnpm --filter @t3tools/web test

      - name: Test deployment gate
        run: |
          node --test infra/sovereign/backup/backup.test.mjs
          node --test infra/sovereign/ci/deploy-and-verify.test.mjs
          node --test infra/sovereign/monitor/monitor.test.mjs

      - name: Build sovereign web and desktop applications
        env:
          T3CODE_OAUTH_ISSUER: https://auth.moondiner.com/api/auth
          T3CODE_OAUTH_CLIENT_ID: t3-code
          T3CODE_OAUTH_RESOURCE: https://relay.moondiner.com
          T3CODE_RELAY_URL: https://relay.moondiner.com
          T3CODE_CLERK_PUBLISHABLE_KEY: ""
          T3CODE_CLERK_JWT_TEMPLATE: ""
          T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_URL: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_DATASET: ""
          T3CODE_RELAY_CLIENT_OTLP_TRACES_TOKEN: ""
          VITE_HOSTED_APP_URL: https://code.moondiner.com
          VITE_HOSTED_APP_CHANNEL: sovereign
          VITE_REMOTE_FAVICONS: "0"
          T3CODE_WEB_SOURCEMAP: "0"
        run: pnpm exec vp run build:desktop

      - name: Verify sovereign client artifacts
        run: |
          grep -Fq 'https://auth.moondiner.com/api/auth' apps/desktop/dist-electron/main.cjs
          grep -Fq 'https://relay.moondiner.com' apps/desktop/dist-electron/main.cjs
          grep -R -Fq 'https://auth.moondiner.com/api/auth' apps/server/dist/client
          grep -R -Fq 'https://relay.moondiner.com' apps/server/dist/client
          if grep -R -Eq 'pk_(live|test)_[A-Za-z0-9_-]{12,}|xaat-[A-Za-z0-9_-]{8,}' \
            apps/desktop/dist-electron apps/server/dist/client; then
            echo 'Sovereign client artifacts contain an external-service credential pattern.' >&2
            exit 1
          fi

      - name: Validate deployment configuration
        run: |
          test -n "$COOLIFY_URL"
          test -n "$COOLIFY_CONTROL_UUID"
          test -n "$COOLIFY_WEB_UUID"
          test -n "$COOLIFY_TOKEN"

      - name: Deploy t3-control and t3-web
        run: node infra/sovereign/ci/deploy-and-verify.mjs
